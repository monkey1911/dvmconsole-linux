name: Build (Linux ARM64)

# Builds dvmcli + libvocoder natively on an ARM64 Linux runner, runs the offline self-test,
# and uploads a tarball. Publishing a GitHub Release (or pushing a v* tag) also attaches it.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    env:
      TAG: ${{ github.event.release.tag_name || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build libvocoder (aarch64)
        run: |
          cmake -S extern/dvmvocoder -B build/vocoder -DCMAKE_BUILD_TYPE=Release
          cmake --build build/vocoder -j"$(nproc)"
          mkdir -p build/native
          cp "$(find build/vocoder -name 'libvocoder.so' | head -1)" build/native/

      - name: Publish dvmcli (linux-arm64, self-contained)
        run: dotnet publish src/dvmcli/dvmcli.csproj -c Release -r linux-arm64 --self-contained true -o out/dvmcli-linux-arm64

      - name: Verify binaries are aarch64
        run: |
          for f in dvmcli libvocoder.so; do
            test -f "out/dvmcli-linux-arm64/$f" || { echo "::error::$f missing from publish output"; exit 1; }
            desc="$(file -b "out/dvmcli-linux-arm64/$f")"
            echo "$f: $desc"
            case "$desc" in *aarch64*|*"ARM aarch64"*) ;; *) echo "::error::$f is not aarch64"; exit 1;; esac
          done

      - name: Self-test
        run: out/dvmcli-linux-arm64/dvmcli selftest

      - name: Package
        run: |
          cp README.md LICENSE out/dvmcli-linux-arm64/
          name="dvmcli-${TAG//\//-}-linux-arm64"
          echo "PKG=$name" >> "$GITHUB_ENV"
          mv out/dvmcli-linux-arm64 "out/$name"
          tar -C out -czf "out/$name.tar.gz" "$name"
          (cd out && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: dvmcli-linux-arm64
          path: out/${{ env.PKG }}.tar.gz*

      - name: Attach to release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "out/$PKG.tar.gz" "out/$PKG.tar.gz.sha256" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "out/$PKG.tar.gz" "out/$PKG.tar.gz.sha256" --repo "$GITHUB_REPOSITORY" \
              --title "dvmcli $TAG (Linux ARM64)" --prerelease --notes "Linux ARM64 proof of concept build. See README for usage."
          fi
